<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ScholarPath{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav><a class="brand" href="{{ url_for('dashboard') if student else url_for('home') }}">ScholarPath</a><div>{% if student %}<a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('documents') }}">Documents</a><a href="{{ url_for('logout') }}">Log out</a>{% elif session.get('admin_id') %}<a href="{{ url_for('admin_dashboard') }}">Admin</a><a href="{{ url_for('logout') }}">Log out</a>{% endif %}</div></nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
