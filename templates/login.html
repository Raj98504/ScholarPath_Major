{% extends 'base.html' %}{% block title %}Login · ScholarPath{% endblock %}{% block content %}<section class="auth"><div class="hero"><span class="eyebrow">SCHOLARSHIP MATCHING</span><h1>Find funding you actually qualify for.</h1><p>Build your profile once. ScholarPath matches eligibility criteria and shows you exactly why a scholarship fits.</p></div><div class="auth-card"><div class="tabs"><button onclick="showTab('login')">Login</button><button onclick="showTab('register')">Register</button></div><form id="login" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="login"><label>Email / admin username<input name="email" type="text" required></label><label>Password<input name="password" type="password" required></label><button class="primary">Log in</button></form><form id="register" method="post" style="display:none"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="register"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required><small>Minimum 8 characters</small></label><button class="primary">Create account</button></form></div></section><script>function showTab(x){document.getElementById('login').style.display=x==='login'?'block':'none';document.getElementById('register').style.display=x==='register'?'block':'none'}</script>{% endblock %}
