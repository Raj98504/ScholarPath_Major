{% extends 'base.html' %}{% block title %}Scholarship · Admin{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">ADMIN / SCHOLARSHIP</span><h1>{{'Edit' if s.id else 'Add'}} scholarship.</h1></div></div><form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><fieldset><legend>Listing Info</legend><div class="grid"><label>Name<input name="name" required value="{{s.name or ''}}"></label><label>Provider<input name="provider" required value="{{s.provider or ''}}"></label><label>Amount (₹)<input name="amount" type="number" value="{{s.amount or ''}}"></label><label>Deadline<input name="deadline" value="{{s.deadline or ''}}"></label><label>Application URL<input name="url" value="{{s.url or ''}}"></label></div><label>Description<textarea name="description">{{s.description or ''}}</textarea><label class="check"><input type="checkbox" name="verified" {{'checked' if s.verified}}> Verified</label><label>Required documents <input name="required_documents" value="{{s.required_documents or ''}}" placeholder="Marksheet, Income Certificate, Bank Passbook"><small>Comma-separated document types used by the application readiness engine.</small></label></fieldset><fieldset><legend>Eligibility</legend><div class="grid"><label>Caste (comma separated)<input name="allowed_caste" value="{{s.allowed_caste or 'Any'}}"></label><label>States<input name="allowed_states" value="{{s.allowed_states or 'Any'}}"></label><label>Gender<input name="allowed_gender" value="{{s.allowed_gender or 'Any'}}"></label><label>Stream<input name="allowed_stream" value="{{s.allowed_stream or 'Any'}}"></label><label>Area<input name="allowed_area" value="{{s.allowed_area or 'Any'}}"></label><label>Max income<input name="max_income" type="number" value="{{s.max_income or ''}}"></label><label>Min marks<input name="min_marks" type="number" value="{{s.min_marks or ''}}"></label><label>Disability required<select name="disability_required"><option value="any">Any</option><option value="yes" {{'selected' if s.disability_required is true}}>Yes</option><option value="no" {{'selected' if s.disability_required is false and s.disability_required is not none}}>No</option></select></label></div></fieldset><button class="primary">Save scholarship</button></form>{% endblock %}
