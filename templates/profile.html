{% extends 'base.html' %}{% block title %}Profile · ScholarPath{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">YOUR PROFILE</span><h1>Tell us about yourself.</h1><p>We use these fields to determine eligibility.</p></div><div class="progress"><b>{{s.profile_percent()}}%</b><div><i style="width:{{s.profile_percent()}}%"></i></div><small>Profile complete</small></div></div><form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><fieldset><legend>Identity</legend><div class="grid"><label>Caste<select name="caste"><option value="">Select</option>{% for x in ['SC','ST','OBC','General'] %}<option {{'selected' if s.caste==x}}>{{x}}</option>{% endfor %}</select></label><label>Gender<select name="gender"><option value="">Select</option>{% for x in ['Female','Male','Other'] %}<option {{'selected' if s.gender==x}}>{{x}}</option>{% endfor %}</select></label></div></fieldset><fieldset><legend>Academic</legend><div class="grid"><label>Marks (%)<input name="marks" type="number" min="0" max="100" step="0.01" value="{{s.marks or ''}}"></label><label>Stream<input name="stream" value="{{s.stream or ''}}" placeholder="e.g. Engineering"></label></div></fieldset><fieldset><legend>Location</legend><div class="grid"><label>State<input name="state" value="{{s.state or ''}}"></label><label>Area<select name="area"><option value="">Select</option><option {{'selected' if s.area=='Urban'}}>Urban</option><option {{'selected' if s.area=='Rural'}}>Rural</option></select></label></div></fieldset><fieldset><legend>Financial</legend><label>Annual family income (₹)<input name="income" type="number" min="0" value="{{s.income or ''}}"></label></fieldset><fieldset><legend>Disability</legend><div class="choice"><label><input type="radio" name="disability" value="yes" {{'checked' if s.disability is true}}> Yes</label><label><input type="radio" name="disability" value="no" {{'checked' if s.disability is false}}> No</label></div></fieldset><button class="primary">Save profile</button></form>{% endblock %}
